name: Verify

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Platform Libraries test branch
        uses: actions/checkout@v4
        with:
          repository: BrunoBS/platform-libraries
          ref: 95ff2c9d981cb5923f47b493536fad57dfefd3ab
          token: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
          path: platform-libraries

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache isolated Maven repository
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/account-service-m2
          key: ${{ runner.os }}-maven-java25-${{ hashFiles('pom.xml', '.github/maven-settings.xml', 'platform-libraries/**/pom.xml', 'platform-libraries/.mvn/maven.config') }}
          restore-keys: |
            ${{ runner.os }}-maven-java25-

      - name: Preload MySQL image from public mirrors
        run: |
          gcr_image=mirror.gcr.io/library/mysql:8.4.11
          ecr_image=public.ecr.aws/docker/library/mysql:8.4.11

          if docker pull "$gcr_image"; then
            docker tag "$gcr_image" mysql:8.4.11
            exit 0
          fi

          echo "Google mirror cache miss; retrying through Amazon ECR Public."
          for delay in 5 15 30; do
            if docker pull "$ecr_image"; then
              docker tag "$ecr_image" mysql:8.4.11
              exit 0
            fi
            echo "ECR Public pull was throttled or unavailable; waiting ${delay}s before retry."
            sleep "$delay"
          done

          echo "Unable to preload MySQL 8.4.11 from the configured public mirrors."
          exit 1

      - name: Install branch Platform Testing modules into isolated Maven repository
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        working-directory: platform-libraries
        run: >
          mvn
          --settings "${GITHUB_WORKSPACE}/.github/maven-settings.xml"
          --batch-mode
          --no-transfer-progress
          -Dmaven.repo.local="${RUNNER_TEMP}/account-service-m2"
          -pl modules/platform-testing/platform-testing-redis,modules/platform-testing/platform-testing-authorization,modules/platform-testing/platform-testing-database
          -am
          install

      - name: Verify with isolated Maven repository
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: >
          mvn
          --settings .github/maven-settings.xml
          --batch-mode
          --no-transfer-progress
          -Dmaven.repo.local="${RUNNER_TEMP}/account-service-m2"
          clean verify

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
