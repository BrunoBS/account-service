name: Verify

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate published Maven model
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PACKAGES_TOKEN:-}" ]; then
            echo "PLATFORM_PACKAGES_TOKEN must provide package read access."
            exit 1
          fi
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress --strict-checksums -Dmaven.repo.local="${RUNNER_TEMP}/account-service-m2" validate

      - name: Preload MySQL image from public mirrors
        run: |
          gcr_image=mirror.gcr.io/library/mysql:8.4.11
          ecr_image=public.ecr.aws/docker/library/mysql:8.4.11

          if docker pull "$gcr_image"; then
            docker tag "$gcr_image" mysql:8.4.11
            exit 0
          fi

          echo "Google mirror cache miss; retrying through Amazon ECR Public."
          for delay in 5 15 30; do
            if docker pull "$ecr_image"; then
              docker tag "$ecr_image" mysql:8.4.11
              exit 0
            fi
            echo "ECR Public pull was throttled or unavailable; waiting ${delay}s before retry."
            sleep "$delay"
          done

          echo "Unable to preload MySQL 8.4.11 from the configured public mirrors."
          exit 1

      - name: Verify with isolated Maven repository
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: >
          mvn
          --settings .github/maven-settings.xml
          --batch-mode
          --no-transfer-progress
          --strict-checksums
          -Dmaven.repo.local="${RUNNER_TEMP}/account-service-m2"
          clean verify

      - name: Record resolved platform artifacts
        if: always()
        run: |
          mkdir -p target/build-evidence
          git rev-parse HEAD > target/build-evidence/service-commit.txt
          mvn --version > target/build-evidence/toolchain.txt
          cp pom.xml target/build-evidence/consumer-pom.xml
          platform_repository="${RUNNER_TEMP}/account-service-m2/br/com/portalmanager/platform/library"
          if [ -d "$platform_repository" ]; then
            find "$platform_repository" -type f \( -name '*.jar' -o -name '*.pom' \) -exec sha256sum {} \; | sort > target/build-evidence/platform-sha256.txt
          fi

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            target/build-evidence/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
