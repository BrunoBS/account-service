name: Foundation consumer probe

on:
  push:
    branches:
      - refactor/consolidated-foundation-consumer

permissions:
  contents: read
  packages: read

jobs:
  verify-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify from empty Maven repository
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: |
          FRESH_REPO="${RUNNER_TEMP}/account-service-m2"
          rm -rf "${FRESH_REPO}"
          mvn --settings .github/maven-settings.xml -Dmaven.repo.local="${FRESH_REPO}" --batch-mode --no-transfer-progress clean verify
