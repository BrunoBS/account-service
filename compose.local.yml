services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/init-audit.sh:/etc/localstack/init/ready.d/init-audit.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "workspace-audit-local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  localstack-data:
  redis-data:
