spring:
  application:
    name: workspace-service
  data:
    redis:
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    properties:
      hibernate:
        session:
          events:
            log: false

platform:
  observability:
    logging:
      levels:
        org.springframework: WARN
        org.testcontainers: WARN
        tc: WARN
        org.flywaydb: WARN
        io.netty: WARN
        br.com.portalmanager.platform.library.testing.database: WARN
        br.com.portalmanager.platform.library.authorization.visibility: WARN
  authorization:
    mode: REAL
  messaging:
    enabled: true
    default-locale: pt-BR
    cache:
      enabled: false
  audit:
    enabled: true
    service-name: workspace-service

workspace:
  parameter:
    runtime:
      enabled: true
      batch-size: 2
    reconciliation:
      enabled: false
