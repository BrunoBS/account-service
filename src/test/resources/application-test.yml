spring:
  application:
    name: workspace-service

platform:
  dynamic-parameter:
    runtime:
      enabled: false
    reconciliation:
      enabled: false
  authorization:
    mode: REAL
    service-url: http://127.0.0.1:9
  messaging:
    enabled: true
    default-locale: pt-BR
    cache:
      enabled: false
  audit:
    enabled: false
