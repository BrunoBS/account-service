spring:
  application:
    name: workspace-service
  data:
    redis:
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    properties:
      hibernate:
        generate_statistics: true
        session:
          events:
            log: false

logging:
  level:
    org.springframework.test.context.cache: DEBUG

platform:
  authorization:
    mode: REAL
    service-url: http://127.0.0.1:9
  messaging:
    enabled: true
    default-locale: pt-BR
    cache:
      enabled: false
  audit:
    enabled: true
    service-name: workspace-service

workspace:
  parameter:
    runtime:
      enabled: true
      batch-size: 2
    reconciliation:
      enabled: false
