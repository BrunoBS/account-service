workspace.not-found=WORKSPACE-0001|404|O workspace solicitado não foi encontrado.|Verifique o identificador informado.
workspace.restore.invalid=WORKSPACE-0002|400|O workspace informado não pode ser restaurado.|Somente workspaces inativos podem ser restaurados.
workspace.delete.invalid=WORKSPACE-0003|400|O workspace informado não pode ser removido.|Somente workspaces inativos podem ser removidos fisicamente.
validation.workspace-type.invalid=WORKSPACE-0101|400|O tipo de workspace é inválido.|Informe ADMIN, MANAGER ou CATALOG.
validation.name.required=WORKSPACE-0102|400|O nome do workspace é obrigatório.|Informe o nome do workspace.
validation.name.size=WORKSPACE-0103|400|O nome do workspace deve possuir entre 3 e 100 caracteres.|Ajuste o nome informado.
validation.name.duplicate=WORKSPACE-0104|400|Já existe um workspace com esse nome.|Informe um nome diferente.
validation.description.size=WORKSPACE-0105|400|A descrição deve possuir entre 10 e 500 caracteres.|Ajuste a descrição informada.
validation.requester.size=WORKSPACE-0106|400|O requester deve possuir pelo menos 5 caracteres.|Ajuste o requester informado.
validation.acronym.required=WORKSPACE-0107|400|O acrônimo é obrigatório.|Informe o acrônimo do workspace.
validation.acronym.size=WORKSPACE-0108|400|O acrônimo deve possuir no máximo 5 caracteres.|Ajuste o acrônimo informado.
validation.email.invalid=WORKSPACE-0109|400|O e-mail informado é inválido.|Informe um endereço de e-mail válido.
validation.approvers.required=WORKSPACE-0110|400|O workspace deve possuir pelo menos um approver.|Informe ao menos um approver.
validation.approver.functional.required=WORKSPACE-0111|400|O funcional do approver é obrigatório.|Informe o funcional do approver.
validation.version.required=WORKSPACE-0112|400|A versão do workspace é obrigatória para atualização.|Envie a versão retornada pela última leitura.
validation.type-filter.invalid=WORKSPACE-0113|400|O filtro de tipo é inválido.|Informe ADMIN, MANAGER ou CATALOG.
validation.approver.functional.duplicate=WORKSPACE-0114|400|O funcional informado já foi adicionado como aprovador deste workspace.|Informe um funcional diferente.
validation.approver.email.duplicate=WORKSPACE-0115|400|O e-mail informado já foi adicionado como aprovador deste workspace.|Informe um e-mail diferente.

schema.undefined=SCHEMA-0101|400|O schema de validação não foi definido.|Informe um schema JSON válido.
schema.invalid.syntax=SCHEMA-0102|400|O schema JSON possui sintaxe inválida.|Corrija o schema informado.
schema.value.required=SCHEMA-0103|400|O valor de {0} é obrigatório.|Informe um valor válido para {0}.
schema.json.invalid.for.schema=SCHEMA-0104|400|O conteúdo de {0} não atende ao schema configurado: {1}|Ajuste o JSON conforme o schema.
schema.persisted.json.invalid=SCHEMA-0501|500|O JSON persistido está inválido.|Corrija o dado persistido antes de continuar.
schema.json.serialization.invalid=SCHEMA-0502|500|Não foi possível serializar o JSON.|Revise o conteúdo antes de persistir.

message.not-found=MESSAGE-0001|404|A mensagem solicitada não foi encontrada.|Verifique o identificador informado.
message.delete.invalid=MESSAGE-0002|400|A mensagem ativa não pode ser removida fisicamente.|Inative a mensagem antes de removê-la.
message.translation.not-found=MESSAGE-0003|404|A tradução solicitada não foi encontrada.|Verifique o identificador da tradução.
message.translation.delete.invalid=MESSAGE-0004|400|A tradução ativa não pode ser removida fisicamente.|Inative a tradução antes de removê-la.
validation.message.service.required=MESSAGE-0101|400|O serviço da mensagem é obrigatório.|Informe o serviço responsável pela mensagem.
validation.message.service.invalid=MESSAGE-0102|400|O serviço informado não existe ou está inativo.|Informe um serviço ativo do catálogo.
validation.message.key.required=MESSAGE-0103|400|A chave da mensagem é obrigatória.|Informe a chave da mensagem.
validation.message.key.invalid=MESSAGE-0104|400|A chave da mensagem possui formato inválido.|Use letras minúsculas, números, ponto, hífen ou sublinhado.
validation.message.key.duplicate=MESSAGE-0105|400|Já existe uma mensagem com esta chave para o serviço informado.|Informe uma chave diferente.
validation.message.code.required=MESSAGE-0106|400|O código da mensagem é obrigatório.|Informe o código da mensagem.
validation.message.code.invalid=MESSAGE-0107|400|O código da mensagem possui formato inválido.|Use letras maiúsculas, números e hífen.
validation.message.code.duplicate=MESSAGE-0108|400|Já existe uma mensagem com este código para o serviço informado.|Informe um código diferente.
validation.message.http-status.invalid=MESSAGE-0109|400|O HTTP status informado é inválido.|Informe um status entre 100 e 599.
validation.message.observation.size=MESSAGE-0110|400|A observação deve possuir no máximo 500 caracteres.|Reduza o conteúdo da observação.
validation.message.version.required=MESSAGE-0111|400|A versão é obrigatória para atualização.|Envie a versão retornada pela última leitura.
validation.message.translation.locale.invalid=MESSAGE-0112|400|O locale informado é inválido.|Informe o locale no formato BCP 47, como pt-BR ou en-US.
validation.message.translation.locale.duplicate=MESSAGE-0113|400|Já existe uma tradução para este locale.|Informe outro locale ou atualize a tradução existente.
validation.message.translation.title.required=MESSAGE-0114|400|O título da tradução é obrigatório e deve possuir até 150 caracteres.|Informe um título válido.
validation.message.translation.detail.required=MESSAGE-0115|400|O detalhe da tradução é obrigatório e deve possuir até 1000 caracteres.|Informe um detalhe válido.
validation.message.translation.suggestion.required=MESSAGE-0116|400|A sugestão da tradução é obrigatória e deve possuir até 1000 caracteres.|Informe uma sugestão válida.

schema.resolution.not-found=SCHEMA-0105|400|Não foi encontrado um schema aplicável para a solicitação.|Cadastre ou publique um schema compatível, ou verifique o schema default.
schema.published.not-found=SCHEMA-0106|400|O schema não possui versão publicada disponível.|Publique uma versão antes de utilizar o schema.
schema.inactive=SCHEMA-0107|400|O schema ou seu tipo está inativo.|Ative o schema e seu tipo antes de utilizá-lo.
schema.scope.invalid=SCHEMA-0108|400|O escopo de schema informado é inválido.|Informe PLATFORM ou WORKSPACE.
platform.request.required=PLATFORM-0101|400|A requisição é obrigatória.|Informe os dados da requisição.
platform.code.invalid=PLATFORM-0102|400|O código deve usar letras minúsculas, números e hífens, com até 50 caracteres.|Informe um código válido.
platform.code.duplicate=PLATFORM-0103|400|Este código já está em uso.|Informe outro código.
platform.name.invalid=PLATFORM-0104|400|O nome é obrigatório e deve ter até 100 caracteres.|Informe um nome válido.
platform.name.duplicate=PLATFORM-0105|400|Este nome já está em uso.|Informe outro nome.
platform.description.invalid=PLATFORM-0106|400|A descrição deve ter até 500 caracteres.|Reduza a descrição.
platform.service.required=PLATFORM-0107|400|O identificador do serviço é obrigatório.|Informe um serviço ativo.
platform.settings.required=PLATFORM-0108|400|As configurações são obrigatórias.|Informe as configurações da feature.
platform.service.inactive=PLATFORM-0109|400|A feature exige um serviço ativo.|Selecione um serviço ativo.
platform.context.inactive=PLATFORM-0110|400|O contexto da feature deve estar ativo.|Selecione um contexto ativo.
platform.service.has-features=PLATFORM-0111|400|Um serviço com features não pode ser excluído.|Remova as features primeiro.
platform.context.has-features=PLATFORM-0112|400|Um contexto com features não pode ser excluído.|Remova as features primeiro.
