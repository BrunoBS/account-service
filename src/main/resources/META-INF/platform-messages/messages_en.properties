workspace.not-found=WORKSPACE-0001|404|The requested workspace was not found.|Verify the provided identifier.
workspace.restore.invalid=WORKSPACE-0002|400|The workspace cannot be restored.|Only inactive workspaces can be restored.
validation.workspace-type.invalid=WORKSPACE-0101|400|The workspace type is invalid.|Provide ADMIN, MANAGER, or CATALOG.
validation.name.required=WORKSPACE-0102|400|The workspace name is required.|Provide the workspace name.
validation.name.size=WORKSPACE-0103|400|The workspace name must contain between 3 and 100 characters.|Adjust the provided name.
validation.name.duplicate=WORKSPACE-0104|400|A workspace with this name already exists.|Provide a different name.
validation.description.size=WORKSPACE-0105|400|The description must contain between 10 and 500 characters.|Adjust the provided description.
validation.requester.size=WORKSPACE-0106|400|The requester must contain at least 5 characters.|Adjust the provided requester.
validation.acronym.required=WORKSPACE-0107|400|The acronym is required.|Provide the workspace acronym.
validation.acronym.size=WORKSPACE-0108|400|The acronym must contain at most 5 characters.|Adjust the provided acronym.
validation.email.invalid=WORKSPACE-0109|400|The provided email address is invalid.|Provide a valid email address.
validation.approvers.required=WORKSPACE-0110|400|The workspace must have at least one approver.|Provide at least one approver.
validation.approver.functional.required=WORKSPACE-0111|400|The approver functional identifier is required.|Provide the approver functional identifier.
validation.version.required=WORKSPACE-0112|400|The workspace version is required for updates.|Send the version returned by the latest read operation.
validation.type-filter.invalid=WORKSPACE-0113|400|The workspace type filter is invalid.|Provide ADMIN, MANAGER, or CATALOG.
validation.approver.functional.duplicate=WORKSPACE-0114|400|The provided functional identifier has already been added as an approver for this workspace.|Provide a different functional identifier.
validation.approver.email.duplicate=WORKSPACE-0115|400|The provided email has already been added as an approver for this workspace.|Provide a different email address.

schema.undefined=SCHEMA-0101|400|The validation schema has not been defined.|Provide a valid JSON schema.
schema.invalid.syntax=SCHEMA-0102|400|The JSON schema has invalid syntax.|Correct the provided schema.
schema.value.required=SCHEMA-0103|400|The value of {0} is required.|Provide a valid value for {0}.
schema.json.invalid.for.schema=SCHEMA-0104|400|The content of {0} does not comply with the configured schema: {1}|Adjust the JSON according to the schema.
schema.persisted.json.invalid=SCHEMA-0501|500|The persisted JSON is invalid.|Correct the persisted data before continuing.
schema.json.serialization.invalid=SCHEMA-0502|500|The JSON could not be serialized.|Review the content before persisting it.
message.not-found=MESSAGE-0001|404|The requested message was not found.|Verify the provided identifier.
message.delete.invalid=MESSAGE-0002|400|An active message cannot be physically deleted.|Inactivate the message before deleting it.
message.translation.not-found=MESSAGE-0003|404|The requested translation was not found.|Verify the translation identifier.
message.translation.delete.invalid=MESSAGE-0004|400|An active translation cannot be physically deleted.|Inactivate the translation before deleting it.
validation.message.service.required=MESSAGE-0101|400|The message service is required.|Provide the service responsible for the message.
validation.message.service.invalid=MESSAGE-0102|400|The provided service does not exist or is inactive.|Provide an active service from the catalog.
validation.message.key.required=MESSAGE-0103|400|The message key is required.|Provide the message key.
validation.message.key.invalid=MESSAGE-0104|400|The message key format is invalid.|Use lowercase letters, numbers, dots, hyphens, or underscores.
validation.message.key.duplicate=MESSAGE-0105|400|A message with this key already exists for the provided service.|Provide a different key.
validation.message.code.required=MESSAGE-0106|400|The message code is required.|Provide the message code.
validation.message.code.invalid=MESSAGE-0107|400|The message code format is invalid.|Use uppercase letters, numbers, and hyphens.
validation.message.code.duplicate=MESSAGE-0108|400|A message with this code already exists for the provided service.|Provide a different code.
validation.message.http-status.invalid=MESSAGE-0109|400|The provided HTTP status is invalid.|Provide a status between 100 and 599.
validation.message.observation.size=MESSAGE-0110|400|The observation must contain at most 500 characters.|Reduce the observation content.
validation.message.version.required=MESSAGE-0111|400|The version is required for updates.|Send the version returned by the latest read operation.
validation.message.translation.locale.invalid=MESSAGE-0112|400|The provided locale is invalid.|Provide the locale in BCP 47 format, such as pt-BR or en-US.
validation.message.translation.locale.duplicate=MESSAGE-0113|400|A translation already exists for this locale.|Provide another locale or update the existing translation.
validation.message.translation.title.required=MESSAGE-0114|400|The translation title is required and must contain at most 150 characters.|Provide a valid title.
validation.message.translation.detail.required=MESSAGE-0115|400|The translation detail is required and must contain at most 1000 characters.|Provide a valid detail.
validation.message.translation.suggestion.required=MESSAGE-0116|400|The translation suggestion is required and must contain at most 1000 characters.|Provide a valid suggestion.

schema.resolution.not-found=SCHEMA-0105|400|No applicable schema was found for the request.|Register or publish a compatible schema, or verify the default schema.
schema.published.not-found=SCHEMA-0106|400|The schema has no published version available.|Publish a version before using the schema.
schema.inactive=SCHEMA-0107|400|The schema or its type is inactive.|Activate the schema and its type before using it.
schema.scope.invalid=SCHEMA-0108|400|The provided schema scope is invalid.|Provide PLATFORM or WORKSPACE.
