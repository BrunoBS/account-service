spring:
  application:
    name: account-service
  main:
    banner-mode: "off"
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/account_service}
    username: ${ACCOUNT_DB_USERNAME:account}
    password: ${ACCOUNT_DB_PASSWORD:account}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

platform:
  authorization:
    enabled: true
    service-url: ${AUTHORIZATION_SERVICE_URL:http://localhost:2020}
  messaging:
    enabled: true
    default-locale: pt-BR
    cache:
      enabled: false
  audit:
    enabled: ${AUDIT_ENABLED:true}
    service-url: ${AUDIT_SERVICE_URL:}
    service-name: account-service
    fail-on-error: false
