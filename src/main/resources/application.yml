spring:
  data:
    web:
      pageable:
        max-page-size: 100
  application:
    name: workspace-service
  main:
    banner-mode: "off"
  datasource:
    url: ${WORKSPACE_DB_URL:jdbc:mysql://localhost:3306/workspace_db}
    username: ${WORKSPACE_DB_USERNAME:workspace}
    password: ${WORKSPACE_DB_PASSWORD:workspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

platform:
  observability:
    logging:
      format: JSON
      levels:
        br.com.portalmanager.platform: ${PLATFORM_LOG_LEVEL:INFO}
        org.springframework.test.context.cache: WARN
  authorization:
    mode: ${PLATFORM_AUTHORIZATION_MODE:REAL}
    service-url: ${AUTHORIZATION_SERVICE_URL:}

  messaging:
    enabled: true
    default-locale: pt-BR
    datasource:
      enabled: true
      view-name: vw_dynamic_bundle_messages
    cache:
      enabled: false
  schema-validation:
    fallback-code: DEFAULT
    view-name: vw_platform_resource_schemas
  audit:
    enabled: ${AUDIT_ENABLED:true}
    service-name: workspace-service

workspace:
  parameter:
    runtime:
      enabled: true
      batch-size: 500
    reconciliation:
      enabled: true
      interval: PT1H

# Expose only aggregate status. Keep dependencies out of liveness.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
