spring:
  application:
    name: workspace-service
  main:
    banner-mode: "off"
  datasource:
    url: ${WORKSPACE_DB_URL:jdbc:mysql://localhost:3306/workspace_service}
    username: ${WORKSPACE_DB_USERNAME:workspace}
    password: ${WORKSPACE_DB_PASSWORD:workspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

platform:
  authorization:
    enabled: true
    service-url: ${AUTHORIZATION_SERVICE_URL:http://localhost:2020}
  messaging:
    enabled: true
    default-locale: pt-BR
    cache:
      enabled: false
  audit:
    enabled: ${AUDIT_ENABLED:true}
    service-url: ${AUDIT_SERVICE_URL:}
    service-name: workspace-service
    fail-on-error: false
